spring.application.name=ai-study-companion

# Database (all overridable via environment for production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ai_study}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aistudy}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aistudy_dev}

# JPA (validate + Flyway own the schema; never auto-migrate in production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Multipart (container-level guard; actual PDF limit is enforced in MaterialService.
# Request size is slightly above 100MB to allow for multipart overhead.)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# Server
server.port=${PORT:8080}

# JWT Authentication (JWT_SECRET MUST be set to a long random value in production)
app.jwt.secret=${JWT_SECRET:ai-study-companion-development-secret-key-2026-change-in-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI via OpenRouter (OPENROUTER_API_KEY empty => offline heuristic fallback)
app.ai.api-key=${OPENROUTER_API_KEY:}
app.ai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1/}
app.ai.chat-model=${OPENROUTER_CHAT_MODEL:openrouter/free}

# Embeddings - offline for prototype
app.ai.embedding-model=offline
app.ai.embedding-dimensions=1536

# AI timeout
app.ai.timeout-ms=${OPENROUTER_TIMEOUT_MS:60000}

# Offline heuristic fallback for the Tutor (and quiz assessment) when the live
# AI request fails or no API key is configured. Explicitly opt out with
# AI_OFFLINE_FALLBACK=false to surface provider errors instead.
app.ai.offline-fallback-enabled=${AI_OFFLINE_FALLBACK:true}

# RAG
app.rag.top-k=${RAG_TOP_K:5}

# Local file storage
app.storage.location=${STORAGE_LOCATION:./storage}

# CORS: comma-separated list of allowed frontend origins.
# Production MUST set CORS_ALLOWED_ORIGINS to the deployed frontend origin(s).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
